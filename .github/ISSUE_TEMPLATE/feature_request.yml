name: Feature request
description: Suggest an improvement or new capability for GeminiWhisper
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please explain the user problem as well as the feature idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: I want to use GeminiWhisper for...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should GeminiWhisper do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways to solve this?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / hotkeys
        - Transcription models
        - Settings UI
        - Auto-paste / clipboard
        - Privacy / security
        - Packaging / installer
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add mockups, screenshots, examples, or links if useful.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for similar requests.
          required: true
