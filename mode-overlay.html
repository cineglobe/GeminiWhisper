<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mode switched</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mode-card {
      width: 292px;
      min-height: 92px;
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.2);
      transform: translateY(10px);
      opacity: 0;
      animation: enter 180ms ease-out forwards;
    }

    .icon {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #ffffff;
      font-size: 28px;
      background: #2563eb;
    }

    .label {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .name {
      margin-top: 3px;
      color: #172033;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }

    @keyframes enter {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="mode-card">
    <div class="icon" id="mode-icon">🎤</div>
    <div>
      <div class="label">Mode</div>
      <div class="name" id="mode-name">Normal</div>
    </div>
  </div>

  <script src="mode-overlay.js"></script>
</body>
</html>
