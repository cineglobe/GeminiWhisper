<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeminiWhisper Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #18202f;
      --muted: #687287;
      --line: #dce2ee;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --success: #047857;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .version {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--panel);
      white-space: nowrap;
      font-size: 13px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      background: #ffffff;
      color: #18202f;
      font: inherit;
    }

    .check-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .check-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcff;
      font-weight: 500;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: default; opacity: 0.58; }

    button.secondary {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
    }

    button.secondary:hover { background: #f8fafc; }

    #status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    #status[data-tone="success"] { color: var(--success); }
    #status[data-tone="error"] { color: var(--error); }

    a { color: var(--accent); }

    @media (max-width: 720px) {
      main { padding: 18px; }
      header { display: grid; }
      .grid, .check-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>GeminiWhisper Settings</h1>
        <p>Configure transcription, model selection, startup, and recording behavior.</p>
      </div>
      <div class="version">v<span id="version">...</span></div>
    </header>

    <form id="settings-form">
      <section>
        <h2>Gemini API</h2>
        <label for="apiKey">
          API key
          <input type="password" id="apiKey" autocomplete="off" placeholder="Paste your Google AI Studio API key">
          <span class="hint"><a href="https://aistudio.google.com/app/apikey" target="_blank">Get a key from Google AI Studio</a>. Stored locally on this device.</span>
        </label>
      </section>

      <section>
        <h2>Transcription</h2>
        <div class="grid">
          <label for="selectedModel">
            Model
            <select id="selectedModel"></select>
            <span class="hint">Gemini 3.5 Flash is the default. Use the latest alias if you prefer automatic model upgrades.</span>
          </label>

          <label for="currentMode">
            Mode
            <select id="currentMode">
              <option value="normal">Normal transcription</option>
              <option value="email">Professional email</option>
            </select>
            <span class="hint">Custom modes can be created from the tray app in future releases.</span>
          </label>

          <label for="audioQuality">
            Audio quality
            <select id="audioQuality">
              <option value="high">High - 44.1 kHz</option>
              <option value="standard">Standard - 16 kHz</option>
            </select>
          </label>

          <label for="overlayPosition">
            Overlay position
            <select id="overlayPosition">
              <option value="center">Center</option>
              <option value="top">Top</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <h2>Behavior</h2>
        <div class="check-row">
          <label><input type="checkbox" id="autoPaste"> Auto-paste</label>
          <label><input type="checkbox" id="showNotifications"> Notifications</label>
          <label><input type="checkbox" id="autoStart"> Launch at login</label>
        </div>
      </section>

      <div class="actions">
        <button type="submit">Save Settings</button>
        <button type="button" class="secondary" id="test-api-key">Test API Key</button>
        <button type="button" class="secondary" id="refresh-models">Refresh Models</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </main>

  <script src="settings.js"></script>
</body>
</html>
